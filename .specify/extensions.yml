installed:
- agent-context
- ascii-diagram
- assess
- bug
- git
- refine
- retro
- ship
- speckit-utils
- staff-review
- status
- tinyspec
- tldr
- token-budget
settings:
  auto_execute_hooks: true
hooks:
  before_constitution:
  - extension: git
    command: speckit.git.initialize
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.git.initialize?
    description: Initialize Git repository before constitution setup
    condition: null
  before_specify:
  - extension: git
    command: speckit.git.feature
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.git.feature?
    description: Create feature branch before specification
    condition: null
  - extension: tinyspec
    command: speckit.tinyspec.classify
    enabled: true
    optional: false
    priority: 10
    prompt: Check if this task is small enough for the lightweight tinyspec workflow?
    description: Auto-classify task complexity before starting the full SDD workflow
    condition: null
  before_clarify:
  - extension: git
    command: speckit.git.commit
    enabled: true
    optional: false
    priority: 10
    prompt: Commit outstanding changes before clarification?
    description: Auto-commit before spec clarification
    condition: null
  before_plan:
  - extension: git
    command: speckit.git.commit
    enabled: true
    optional: false
    priority: 10
    prompt: Commit outstanding changes before planning?
    description: Auto-commit before implementation planning
    condition: null
  - extension: token-budget
    command: speckit.token-budget.scope
    enabled: true
    optional: false
    priority: 10
    prompt: Scope a focused reading manifest for /speckit.plan?
    description: Scope reading manifest before planning
    condition: null
  before_tasks:
  - extension: git
    command: speckit.git.commit
    enabled: true
    optional: false
    priority: 10
    prompt: Commit outstanding changes before task generation?
    description: Auto-commit before task generation
    condition: null
  - extension: token-budget
    command: speckit.token-budget.scope
    enabled: true
    optional: false
    priority: 10
    prompt: Scope a focused reading manifest for /speckit.tasks?
    description: Scope reading manifest before task generation
    condition: null
  before_implement:
  - extension: git
    command: speckit.git.commit
    enabled: true
    optional: false
    priority: 10
    prompt: Commit outstanding changes before implementation?
    description: Auto-commit before implementation
    condition: null
  - extension: token-budget
    command: speckit.token-budget.scope
    enabled: true
    optional: false
    priority: 10
    prompt: Scope a focused reading manifest for /speckit.implement?
    description: Scope reading manifest before implementation
    condition: null
  before_checklist:
  - extension: git
    command: speckit.git.commit
    enabled: true
    optional: false
    priority: 10
    prompt: Commit outstanding changes before checklist?
    description: Auto-commit before checklist generation
    condition: null
  before_analyze:
  - extension: git
    command: speckit.git.commit
    enabled: true
    optional: false
    priority: 10
    prompt: Commit outstanding changes before analysis?
    description: Auto-commit before analysis
    condition: null
  before_taskstoissues:
  - extension: git
    command: speckit.git.commit
    enabled: true
    optional: false
    priority: 10
    prompt: Commit outstanding changes before issue sync?
    description: Auto-commit before tasks-to-issues conversion
    condition: null
  after_constitution:
  - extension: git
    command: speckit.git.commit
    enabled: true
    optional: false
    priority: 10
    prompt: Commit constitution changes?
    description: Auto-commit after constitution update
    condition: null
  after_specify:
  - extension: git
    command: speckit.git.commit
    enabled: true
    optional: false
    priority: 10
    prompt: Commit specification changes?
    description: Auto-commit after specification
    condition: null
  - extension: agent-context
    command: speckit.agent-context.update
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.agent-context.update?
    description: Refresh agent context after specification
    condition: null
  - extension: refine
    command: speckit.refine.status
    enabled: true
    optional: false
    priority: 10
    prompt: Check artifact sync status after specification?
    description: Show sync status after spec generation
    condition: null
  - extension: ascii-diagram
    command: speckit.ascii-diagram.render
    enabled: true
    optional: false
    priority: 10
    prompt: Render a text diagram (state machine / flow) for this spec?
    description: Sketch a state/flow diagram right after specification
    condition: null
  - extension: speckit-utils
    command: speckit.speckit-utils.doctor
    enabled: true
    optional: false
    priority: 10
    prompt: Run project health check?
    description: Validate project health after specification generation
    condition: null
  - extension: token-budget
    command: speckit.token-budget.compact
    enabled: true
    optional: false
    priority: 10
    prompt: Compact spec.md to reduce tokens for /speckit.plan?
    description: Compact spec after specification
    condition: null
  after_clarify:
  - extension: git
    command: speckit.git.commit
    enabled: true
    optional: false
    priority: 10
    prompt: Commit clarification changes?
    description: Auto-commit after spec clarification
    condition: null
  after_plan:
  - extension: git
    command: speckit.git.commit
    enabled: true
    optional: false
    priority: 10
    prompt: Commit plan changes?
    description: Auto-commit after implementation planning
    condition: null
  - extension: agent-context
    command: speckit.agent-context.update
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.agent-context.update?
    description: Refresh agent context after planning
    condition: null
  - extension: refine
    command: speckit.refine.status
    enabled: true
    optional: false
    priority: 10
    prompt: Check artifact sync status after planning?
    description: Show sync status after plan generation
    condition: null
  - extension: ascii-diagram
    command: speckit.ascii-diagram.render
    enabled: true
    optional: false
    priority: 10
    prompt: Render a text diagram (architecture) for this plan?
    description: Sketch an architecture/component diagram right after planning
    condition: null
  - extension: speckit-utils
    command: speckit.speckit-utils.validate
    enabled: true
    optional: false
    priority: 10
    prompt: Validate spec-to-task traceability?
    description: Verify requirements map to planned tasks after planning
    condition: null
  - extension: token-budget
    command: speckit.token-budget.compact
    enabled: true
    optional: false
    priority: 10
    prompt: Compact plan and design docs to reduce tokens for /speckit.tasks?
    description: Compact plan docs after planning
    condition: null
  after_tasks:
  - extension: git
    command: speckit.git.commit
    enabled: true
    optional: false
    priority: 10
    prompt: Commit task changes?
    description: Auto-commit after task generation
    condition: null
  - extension: ascii-diagram
    command: speckit.ascii-diagram.render
    enabled: true
    optional: false
    priority: 10
    prompt: Render a task dependency diagram for this task list?
    description: Sketch a dependency graph right after task breakdown
    condition: null
  - extension: token-budget
    command: speckit.token-budget.compact
    enabled: true
    optional: false
    priority: 10
    prompt: Compact tasks.md to reduce tokens for /speckit.implement?
    description: Compact tasks after task generation
    condition: null
  after_implement:
  - extension: git
    command: speckit.git.commit
    enabled: true
    optional: false
    priority: 10
    prompt: Commit implementation changes?
    description: Auto-commit after implementation
    condition: null
  - extension: staff-review
    command: speckit.staff-review.run
    enabled: true
    optional: false
    priority: 10
    prompt: Run staff-level code review?
    description: Reviews implementation changes against spec for correctness, security,
      and quality
    condition: null
  - extension: ship
    command: speckit.ship.run
    enabled: true
    optional: false
    priority: 10
    prompt: Ship this feature?
    description: Runs pre-flight checks, syncs branches, generates changelog, and
      creates PR
    condition: null
  after_checklist:
  - extension: git
    command: speckit.git.commit
    enabled: true
    optional: false
    priority: 10
    prompt: Commit checklist changes?
    description: Auto-commit after checklist generation
    condition: null
  after_analyze:
  - extension: git
    command: speckit.git.commit
    enabled: true
    optional: false
    priority: 10
    prompt: Commit analysis results?
    description: Auto-commit after analysis
    condition: null
  - extension: ascii-diagram
    command: speckit.ascii-diagram.render
    enabled: true
    optional: false
    priority: 10
    prompt: Render a requirement/task coverage diagram for this analysis?
    description: Sketch a coverage/traceability diagram, printed inline (analyze is
      read-only — no file is written)
    condition: null
  after_taskstoissues:
  - extension: git
    command: speckit.git.commit
    enabled: true
    optional: false
    priority: 10
    prompt: Commit after syncing issues?
    description: Auto-commit after tasks-to-issues conversion
    condition: null
