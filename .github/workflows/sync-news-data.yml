name: Scheduled News & Data Auto-Sync

on:
  schedule:
    # Runs every 2 hours during active market/assembly hours (06:00 to 20:00 UTC) and midnight UTC
    - cron: '0 6-20/2 * * *'
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-and-update-data:
    name: Auto-Sync Telegram, News & NotebookLM Pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: 1. Telegram Channel Document Extraction & Indexing
        run: |
          python3 src/telegram_channel_sync.py

      - name: 2. Sindicación de Noticias & Termómetro de Sentimiento
        run: |
          python3 src/sentiment_thermometer.py || true

      - name: 3. NotebookLM Document Preparation & Ingestion
        env:
          NOTEBOOKLM_TOKEN: ${{ secrets.NOTEBOOKLM_TOKEN }}
        run: |
          python3 src/upload_to_notebooklm.py || true

      - name: 4. Autonomous Data Ingestion & Manifest Check
        run: |
          python3 src/data_ingestion.py --run-once

      - name: 5. Re-generate Consolidated Datasets & Metrics
        run: |
          python3 src/analysis_engine.py

      - name: 6. Recompile Strategic PDF Guide, Check Timeline & Validate Invariants
        run: |
          python3 src/generate_pdf.py -i docs/Guia_Estrategica_Negociacion_Huelga_Airbus_2026.md -o docs/Guia_Estrategica_Negociacion_Huelga_Airbus_2026.pdf || true
          python3 src/validate_timeline_freshness.py
          python3 src/validate_invariants.py
          python3 src/validate_sources.py
      - name: 7. Commit & Push Updated Data to Main
        run: |
          git add data/ dashboard/data.js docs/
          if git diff --staged --quiet; then
            echo "No data changes detected. Everything up to date."
          else
            git commit -m "chore(auto-sync): update live datasets, news feeds and telegram archive [skip ci]"
            git push origin main
          fi
