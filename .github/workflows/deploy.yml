name: Build and Deploy Airbus Strike Analytics

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  validate-build-deploy:
    name: Validate, Build & Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install || true
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: 1. Validate External Sources & Citations
        run: |
          python3 src/validate_sources.py

      - name: 2. Validate Mathematical, Census & Financial Invariants
        run: |
          python3 src/validate_invariants.py

      - name: 3. Run Econometric Analysis Engine
        run: |
          python3 src/analysis_engine.py

      - name: 4. Run Automated Test Suite
        run: |
          python3 -m unittest discover -s tests -p "test_*.py"

      - name: 5. Install Chromium for Publication PDF
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium || sudo apt-get install -y chromium-browser

      - name: 6. Compile Publication PDF
        run: |
          python3 src/generate_pdf.py -i docs/Guia_Estrategica_Negociacion_Huelga_Airbus_2026.md -o docs/Guia_Estrategica_Negociacion_Huelga_Airbus_2026.pdf
          mkdir -p dashboard/docs
          cp docs/Guia_Estrategica_Negociacion_Huelga_Airbus_2026.pdf dashboard/docs/
          cp docs/Guia_Estrategica_Negociacion_Huelga_Airbus_2026.md dashboard/docs/

      - name: 7. Upload PDF Guide Artifact
        uses: actions/upload-artifact@v4
        with:
          name: airbus-strike-guide-pdf
          path: docs/Guia_Estrategica_Negociacion_Huelga_Airbus_2026.pdf

      - name: 8. Prepare static dashboard bundle
        run: |
          mkdir -p _site
          cp -r dashboard/* _site/
          mkdir -p _site/data _site/docs
          cp -r data/* _site/data/ || true
          cp -r docs/* _site/docs/ || true

      - name: 9. Deploy to GitHub Pages (gh-pages branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
